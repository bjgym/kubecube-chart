kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.4.1
  creationTimestamp: null
  name: agentpermissions.app.kubecube.io
spec:
  group: app.kubecube.io
  names:
    categories:
    - kubecube
    kind: AgentPermission
    listKind: AgentPermissionList
    plural: agentpermissions
    singular: agentpermission
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.effect
      name: Effect
      type: string
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.ttl
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: AgentPermission is the Schema for the agentpermissions API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: AgentPermissionSpec defines the desired state of AgentPermission
            properties:
              cluster:
                description: Cluster the authorized objects live in. One authorization
                  covers one cluster and the namespaces of one project.
                type: string
              effect:
                description: "PermissionEffect is what an authorization does when
                  it matches. \n Deny exists as a value rather than as an absence
                  because a narrower refusal has to be expressible: \"everything this
                  group holds except this object\" has no allow-only spelling, and
                  an operator writing one needs a way to say it."
                enum:
                - Allow
                - Deny
                type: string
              groupRef:
                description: GroupRef makes this a group-scoped authorization. A Baseline
                  is always one of these, and it is evaluated against the group's
                  live members rather than against a copy taken when the session started.
                properties:
                  cluster:
                    description: Cluster the group's members live in.
                    type: string
                  name:
                    description: Name of the ResourceGroup.
                    type: string
                  namespace:
                    description: Namespace the group and its members live in.
                    type: string
                  uid:
                    description: UID of the ResourceGroup.
                    type: string
                required:
                - cluster
                - name
                - namespace
                - uid
                type: object
              namespaces:
                description: Namespaces the authorization reaches. They must share
                  the group's tenant and project, and a Baseline carries none because
                  its members say where it reaches.
                items:
                  type: string
                type: array
              sessionRef:
                description: SessionRef makes this a session-scoped authorization.
                  Exactly one of GroupRef and SessionRef is set.
                properties:
                  name:
                    description: Name of the object.
                    type: string
                  namespace:
                    description: Namespace the object lives in.
                    type: string
                  uid:
                    description: UID of the object.
                    type: string
                required:
                - name
                - namespace
                - uid
                type: object
              source:
                description: PermissionSource is where an authorization came from.
                  A person creates a Manual one, a controller compiles the Baseline
                  from the group's declared members, and an approved request produces
                  a Request one. The source is what lets the platform refuse a hand-written
                  grant the scope rules would never compile, and lets revocation treat
                  the three differently.
                enum:
                - Baseline
                - Manual
                - Request
                type: string
              target:
                description: 'PermissionTarget is which objects an authorization covers,
                  expressed as the conditions a member object satisfies. The conditions
                  are ANDed: an object must be in the namespace set, of a listed kind,
                  carry the labels, carry the annotations and be one of the explicit
                  objects, for every condition that is set. An unset condition constrains
                  nothing.'
                properties:
                  kinds:
                    description: 'Kinds are fully qualified types, "apps/v1/Deployment"
                      or "v1/ConfigMap". A kind alone would not identify a type: two
                      API groups can carry the same kind.'
                    items:
                      type: string
                    type: array
                  matchAnnotations:
                    additionalProperties:
                      type: string
                    description: MatchAnnotations narrows by annotation, after the
                      read. Kubernetes has no annotation selector, so a result filtered
                      this way is marked as filtered rather than claimed to be exact.
                    type: object
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: MatchLabels narrows by label selector.
                    type: object
                  objects:
                    description: Objects names explicit objects, the most specific
                      condition there is.
                    items:
                      description: 'TargetObject names one object an authorization
                        or a request is about. Unlike ObjectRef it carries the API
                        version, because a kind alone does not identify a type: the
                        same kind can exist in two API groups.'
                      properties:
                        apiVersion:
                          description: APIVersion is the fully qualified version,
                            for example apps/v1.
                          type: string
                        kind:
                          description: Kind of the object.
                          type: string
                        name:
                          description: Name of the object.
                          type: string
