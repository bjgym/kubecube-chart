global:
  # Override the deployment namespace
  namespaceOverride: ""

  # control-plane node IP which is used for exporting NodePort svc.
  nodeIP: "x.x.x.x"

  # set "true" to deploy if there were not already in cluster.
  dependencesEnable:
    hnc: "true"
    ingressController: "true"
    localPathStorage: "true"
    metricServer: "true"

  hotPlugEnable:
    pivot:
      logseer: "disabled"
      logagent: "disabled"
      elasticsearch: "disabled"
      monitoring: "enabled"
      thanos: "enabled"
    common:
      logseer: "disabled"
      logagent: "disabled"
      elasticsearch: "disabled"
      monitoring: "enabled"
      thanos: "disabled"

  componentsEnable:
    kubecube: "true"
    warden: "true"
    audit: "true"
    webconsole: "true"
    cloudshell: "true"
    frontend: "true"

  # imagePullSecrets for all pods
  imagePullSecrets: [ ]

  dataDir: "/data"

  localKubeConfig: xx # local cluster kubeconfig base64
  pivotKubeConfig: xx # pivot cluster kubeconfig base64

  ## kubecube certificate config
  certs:
    ## @param certs.mode "auto" and "custom" are provided
    ## "auto" means auto generate certificate
    ## "custom" means use user certificate
    mode: auto
    auto:
      ## @param certs.auto.expiry expiry of the certificate
      expiry: 43800h
      ## @param certs.auto.hosts hosts of the certificate
      hosts: [
        "*.{{ .Release.Namespace }}.svc.cluster.local",
        "*.{{ .Release.Namespace }}.svc",
        "*.{{ .Release.Namespace }}",
        "localhost",
        "127.0.0.1"
      ]
    custom:
      ## @param certs.custom.caCrt ca of the certificate
      caCrt: |
        -----BEGIN CERTIFICATE-----
        XXXXXXXXXXXXXXXXXXXXXXXXXXX
        -----END CERTIFICATE-----
      ## @param certs.custom.caKey key of the ca
      caKey: |
        -----BEGIN RSA PRIVATE KEY-----
        XXXXXXXXXXXXXXXXXXXXXXXXXXX
        -----END RSA PRIVATE KEY-----
      ## @param certs.custom.crt crt of the certificate
      crt: |
        -----BEGIN CERTIFICATE-----
        XXXXXXXXXXXXXXXXXXXXXXXXXXX
        -----END CERTIFICATE-----
      ## @param certs.custom.key key of the certificate
      key: |
        -----BEGIN RSA PRIVATE KEY-----
        XXXXXXXXXXXXXXXXXXXXXXXXXXX
        -----END RSA PRIVATE KEY-----

  # kubecube hub config
  hub:
    registry: docker.io
    project: kubecube
    username: kubecube
    password: XXX
    email: kubecube@163.com

  # kubecube all images
  images:
    frontend: frontend:v1.3.0-multi
    kubecube: cube:v1.8.2
    warden: warden:v1.8.2
    wardenInit: warden-init:v1.8.2
    dependenceJob: warden-dependence:v1.2.0
    audit: audit:v1.2.0
    webconsole: webconsole:v1.3.0
    cloudshell: cloudshell:v1.2.6
    hnc: hnc-manager:v1.0.0
    ingressController: ingress-nginx-controller:v1.2.0
    ingressControllerJob: ingress-nginx-kube-webhook-certgen:v1.1.1
    localPathStorageProvisioner: rancher-local-path-provisioner:v0.0.19-m
    localPathStorageConfigmap: busybox:latest-m
    metricsServer: rancher-metrics-server:v0.4.1-m
    cfssl: cfssl:v1.6.5
    kubectl: bitnami-kubectl:1.25.7

kubecube:
  # kubecube/deployment.yaml
  replicas: 1
  resources: { }
    # If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 500m
    #   memory: 1Gi
    # requests:
    #   cpu: 500m
  #   memory: 1Gi
  nodeSelector: { }
  affinity: { }
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
  args:
    maxSize: 1000
    maxBackups: 7
    maxAge: 3
    compress: false
    logLevel: info
    jsonEncode: false
    stacktraceLevel: error
    securePort: 7443
    webhookServerPort: 9443
    leaderElect: true
    genericAuthIsEnable: false
    genericAuthUrl: example.com
    genericAuthMethod: GET
    genericAuthScheme: https
    genericAuthInsecureSkikVerify: true
    # Adapt requests to the group/version a member cluster actually serves.
    # On by default: with it off, a member cluster whose api versions differ
    # from the ones the control plane assumes fails on every request.
    enableVersionConversion: true
  env:
    downloadCharts: "false" # todo: this value can be removed
    downloadChartsUrl: "https://kubecube.nos-eastchina1.126.net/helm-chart/third/third-charts.tar.gz" # todo: this value can be removed
    pivotCubeSvc: kubecube:7443 # todo: this value can be removed
    jwtSecret: "56F0D8DB90241C6E"
    retainMemberClusterResource: "true"
    wardenRegisterModeEnable: "true"

  # kubecube/kubecube-auth-config.yaml
  authConfig:
    # Defaults every identity provider inherits when it does not set its own.
    # describeName is the product brand shown on the login button and in the
    # browser title; it is the chart-side counterpart of the front end's
    # KUBECUBE_BRAND_NAME build argument.
    global:
      describeName: "Kubecube"
      # Public base URL of the console, used as the OAuth redirect target.
      host: ""
      # Icon URL for the provider button; empty falls back to the bundled icon.
      img: ""
    github:
      enabled: false
      clientId: ""
      clientSecret: ""
    # Generic OAuth2 / SSO providers, keyed by the name the login page shows and
    # that /api/v1/cube/oauth/redirect receives as the `key` query parameter.
    # The public half is rendered into the kubecube-auth-config ConfigMap; the
    # private half (clientSecret, tokenUrl, userUrl) goes into the Secret of the
    # same name, which only the cube service reads.
    #
    # `type` selects the backend login path and is one of:
    #   sso     - the OAuth2 flow implemented by this block (the default)
    #   github  - the built-in GitHub provider
    #   generic - authenticate from request headers injected by an upstream
    #             gateway instead of exchanging a code
    #
    #   sso:
    #     corp-sso:
    #       enabled: true
    #       type: sso
    #       describeName: "My Cloud"
    #       clientId: "my-client-id"
    #       clientSecret: "my-client-secret"
    #       host: "https://kubecube.example.com"
    #       loginUrl: "https://sso.example.com/oauth2/authorize?response_type=code&client_id=CLIENT_ID_VALUE&scope=SCOPE_VALUE&redirect_uri=HOST_VALUE"
    #       tokenUrl: "https://sso.example.com/oauth2/token?client_id=%s&client_secret=%s&code=%s"
    #       userUrl: "https://sso.example.com/oauth2/user?access_token=%s"
    sso: {}

warden:
  # warden/deployment.yaml
  replicas: 1
  nodeSelector: { }
  affinity: { }
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
    - effect: NoSchedule
      key: node.kubecube.io
      operator: Exists
  containers:
    warden:
      resources: { }
        # If you do want to specify resources, uncomment the following
      # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
      #        limits:
      #          cpu: 300m
      #          memory: 512Mi
      #        requests:
      #          cpu: 300m
      #          memory: 512Mi
      args:
        maxSize: 1000
        maxBackups: 7
        maxAge: 3
        compress: false
        logLevel: info
        jsonEncode: false
        stacktraceLevel: error
        cluster: "pivot-cluster"  # current cluster name
        leaderElect: false
        inMemberCluster: false    # is member cluster or not
        isClusterWritable: true   # is cluster allowed to write
      env:
        JWTSecret: "56F0D8DB90241C6E"  # jwt secret for jwt token gen
        DetachedNsLabelKey: "detached.kubecube.io/ns"
    downloader:
      env:
        downloadCharts: "false"  # download charts or use local
        downloadURL: "" # where to download charts, empty means use default

audit:
  # audit/deployment.yaml
  replicas: 1
  resources: { }
    # If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  #    limits:
  #      cpu: 100m
  #      memory: 128Mi
  #    requests:
  #      cpu: 100m
  #      memory: 128Mi
  nodeSelector: { }
  affinity: { }
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists

webconsole:
  # webconsole/deployment.yaml
  replicas: 1
  resources: { }
    # If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  #    limits:
  #      cpu: 100m
  #      memory: 128Mi
  #    requests:
  #      cpu: 100m
  #      memory: 128Mi
  args:
    maxSize: 1000
    maxBackups: 7
    maxAge: 3
    compress: false
    logLevel: info
    jsonEncode: false
    stacktraceLevel: error
  nodeSelector: { }
  affinity: { }
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
  jwtSecret: 56F0D8DB90241C6E

