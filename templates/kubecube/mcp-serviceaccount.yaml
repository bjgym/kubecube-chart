{{- if and (eq .Values.global.componentsEnable.mcp "true") (eq .Values.global.componentsEnable.kubecube "true") }}
# kubecube-mcp holds no Kubernetes API identity: every tool calls the platform
# API with the session's token, and the platform decides what may happen. It
# therefore gets a ServiceAccount that cannot receive a token, and no Role,
# RoleBinding, ClusterRole, ClusterRoleBinding or Secret is created for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubecube-mcp
  namespace: {{ template "kubecube.namespace" . }}
  labels:
    kubecube.io/app: kubecube-mcp
automountServiceAccountToken: false
---
{{- end }}
