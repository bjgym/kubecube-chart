{{- if eq .Values.global.componentsEnable.kubecube "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubecube-auth-mapping
  namespace: {{ template "kubecube.namespace" . }}
data:
  # The catalogue is the server's definition of what may be granted, and at
  # which levels. A console chooses items from it; it never defines rules, and an
  # item it does not hold fails the whole request rather than being dropped.
  #
  # A level is a property of the item, not of the reader: it used to be decided
  # by the role's kubecube.io/role label, which meant a role whose label
  # disagreed silently lost items instead of reporting anything.
  #
  # levels: platform — the whole platform; tenant — one tenant; project — one
  # project. The values are the ones the kubecube.io/role label carries.
  catalogue: |
    items:
      deployments.manage:
        resources: "deployments;deployments/rollback;deployments/scale;deployments/status;replicasets;replicasets/scale;replicasets/status;dashboards;horizontalpodautoscalers;horizontalpodautoscalers/status;events;pods;pods/log;pods/attach;pods/status;pods/exec;configmaps;secrets;resourcequotas;persistentvolumeclaims"
        levels: [platform, tenant, project]
      statefulsets.manage:
        resources: "statefulsets;statefulsets/scale;statefulsets/status;dashboards;horizontalpodautoscalers;horizontalpodautoscalers/status;events;pods;pods/log;pods/attach;pods/status;pods/exec;configmaps;secrets;resourcequotas;persistentvolumeclaims"
        levels: [platform, tenant, project]
      daemonsets.manage:
        resources: "daemonsets;daemonsets/status;dashboards;horizontalpodautoscalers;horizontalpodautoscalers/status;events;pods;pods/log;pods/attach;pods/status;pods/exec;configmaps;secrets;resourcequotas;persistentvolumeclaims"
        levels: [platform, tenant, project]
      cronjobs.manage:
        resources: "cronjobs;cronjobs/status;jobs;jobs/status;dashboards;events;pods;pods/log;pods/attach;pods/status;pods/exec;configmaps;secrets;resourcequotas;persistentvolumeclaims"
        levels: [platform, tenant, project]
      jobs.manage:
        resources: "jobs;jobs/status;dashboards;events;pods;pods/log;pods/attach;pods/status;pods/exec;configmaps;secrets;resourcequotas;persistentvolumeclaims"
        levels: [platform, tenant, project]
      pods.manage:
        resources: "dashboards;events;pods;pods/log;pods/attach;pods/status;pods/exec"
        levels: [platform, tenant, project]
      services.manage:
        resources: "services;services/status;endpoints;events;pods"
        levels: [platform, tenant, project]
      ingresses.manage:
        resources: "ingresses;ingresses/status;services;secrets"
        levels: [platform, tenant, project]
      loadbalancer.manage:
        resources: "loadbalancers;dashboards;events"
        levels: [platform, tenant, project]
      storage.manage:
        resources: "persistentvolumeclaims;persistentvolumeclaims/status;pods;dashboards"
        levels: [platform, tenant, project]
      secrets.manage:
        resources: "secrets"
        levels: [platform, tenant, project]
      configmaps.manage:
        resources: "configmaps"
        levels: [platform, tenant, project]
      pdb.manage:
        resources: "poddisruptionbudgets;poddisruptionbudgets/status"
        levels: [platform, tenant, project]
      olm.manage:
        resources: "catalogsources;packagemanifests;clusterserviceversions;operatorgroups;subscriptions;installplans"
        levels: [platform, tenant, project]
      # resourcegroups.manage and resourcegroups.scope were declared here ahead of
      # the feature that would evaluate them, and are removed rather than kept
      # unchecked. Nothing in a deployment can honour them: the chart installs no
      # app.kubecube.io CRD, no built-in role grants resourcegroups,
      # resourcegroups/status or resourcegroups/members, and the string
      # `resourcegroups/members` is evaluated nowhere in the code. An item here is
      # a checkbox the console offers, so an item nothing can honour is a promise
      # the permission page cannot keep — and a custom role could still tick it and
      # be written rules for an API the cluster does not serve. Put them back
      # together with the CRD and the evaluation, not before.
      #
      # Managing the cluster's own CRDs is the platform's business alone.
      crds.manage:
        resources: "customresourcedefinitions"
        levels: [platform]
{{- end }}
