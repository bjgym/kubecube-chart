{{- if and (eq .Values.global.componentsEnable.kubecube "true") .Values.kubecube.authConfig.sso }}
apiVersion: v1
kind: Secret
metadata:
  name: kubecube-auth-config
  namespace: {{ template "kubecube.namespace" . }}
type: Opaque
data:
  # The private half of each SSO provider config, keyed by provider name to match
  # the ConfigMap. Only the cube service reads this: it URL-unescapes the value
  # and parses it as YAML, so the payload is url-escaped before base64 encoding.
  # The keys are client_secret, tokenUrl and userUrl.
{{- range $name, $provider := .Values.kubecube.authConfig.sso }}
  {{ $name }}: {{ printf "client_secret: %s\ntokenUrl: %s\nuserUrl: %s" $provider.clientSecret $provider.tokenUrl $provider.userUrl | urlquery | b64enc | quote }}
{{- end }}
---
{{- end }}
