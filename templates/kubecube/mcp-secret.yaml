{{- if eq .Values.global.componentsEnable.kubecube "true" }}
{{- $namespace := include "kubecube.namespace" . }}
{{- $secretName := required "mcp.tokenSecret.secretName must name the MCP session-token Secret" .Values.mcp.tokenSecret.secretName }}
{{- $secretKey := required "mcp.tokenSecret.key must name the token key inside that Secret" .Values.mcp.tokenSecret.key }}
{{- $existing := lookup "v1" "Secret" $namespace $secretName }}
{{- $token := "" }}
{{- if $existing }}
{{- $token = default "" (index $existing.data $secretKey) }}
{{- end }}
{{- if not $token }}
{{- $token = randAlphaNum 64 | b64enc }}
{{- end }}
# The signing key of the agent surface, shared by cube (which signs and verifies
# session tokens) and kubecube-mcp (which verifies them locally). It is separate
# from the console's JWT_SECRET on purpose: a token issued for a person and one
# issued for an agent must not open each other's surface.
#
# Rendered whenever kubecube is enabled, even with MCP off, because cube reads
# the key at startup and fails closed when it is missing. `lookup` preserves an
# existing value across `helm upgrade`; a fresh install gets a random
# 64-character value, so the key never appears in values.yaml or in a rendered
# manifest.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  labels:
    kubecube.io/app: kubecube-mcp
type: Opaque
data:
  {{ $secretKey }}: {{ $token | quote }}
---
{{- end }}
