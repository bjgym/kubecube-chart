{{- if and (eq .Values.global.componentsEnable.mcp "true") (eq .Values.global.componentsEnable.kubecube "true") }}
# Cluster-internal only: the console's nginx proxies `/mcp` to this Service, and
# nothing outside the cluster reaches it directly.
apiVersion: v1
kind: Service
metadata:
  name: kubecube-mcp
  namespace: {{ template "kubecube.namespace" . }}
  labels:
    kubecube.io/app: kubecube-mcp
spec:
  type: ClusterIP
  selector:
    kubecube.io/app: kubecube-mcp
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
{{- end }}
