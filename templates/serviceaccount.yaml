{{- if or (eq .Values.global.componentsEnable.kubecube "true") (eq .Values.global.componentsEnable.warden "true") }}
# The identity the platform's own components run as. Both Deployments name it,
# and the ClusterRole that carries the platform's permissions is bound to it and
# to nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "kubecube.serviceAccountName" . }}
  namespace: {{ template "kubecube.namespace" . }}
  labels:
    kubecube.io/app: kubecube
{{- end }}
