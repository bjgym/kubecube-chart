{{- if eq .Values.global.componentsEnable.frontend "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ template "kubecube.namespace" . }}
  labels:
    kubecube.io/app: frontend
spec:
  selector:
    matchLabels:
      kubecube.io/app: frontend
  replicas: {{ .Values.frontend.replicas }}
  template:
    metadata:
      labels:
        kubecube.io/app: frontend
        app: frontend
      annotations:
        # The nginx configuration is mounted with subPath, so a ConfigMap update
        # never reaches a running pod. Rolling the pod when the rendered
        # ConfigMap changes is what actually applies a new proxy route or TLS
        # setting.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/frontend/nginx-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations}}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nginx
          image: {{ default (printf "%s/%s/%s" .Values.global.hub.registry .Values.global.hub.project .Values.global.images.frontend) .Values.frontend.image | quote }}
          imagePullPolicy: IfNotPresent
          resources:
          {{- toYaml .Values.frontend.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
            {{- if .Values.frontend.tls.enabled }}
            - name: https
              containerPort: 443
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["/usr/sbin/nginx","-s","quit"]
          # The probes stay on HTTP port 80 on purpose: when TLS is enabled the
          # HTTP server keeps serving /healthz and redirects every other path.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            {{- if .Values.frontend.tls.enabled }}
            - name: frontend-tls
              mountPath: /etc/nginx/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
        {{- if .Values.frontend.tls.enabled }}
        # Operator-provided browser certificate. The chart never creates it.
        - name: frontend-tls
          secret:
            secretName: {{ required "frontend.tls.secretName must be set when frontend.tls.enabled is true" .Values.frontend.tls.secretName }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
---
{{- end }}
