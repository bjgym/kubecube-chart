#{{- if eq .Values.global.componentsEnable.frontend "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ template "kubecube.namespace" . }}
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /var/run/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        upstream cube {
            server kubecube:7443;
        }
        upstream audit {
            server audit:8888;
        }

        upstream webconsole {
            server webconsole:9081;
        }

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  65;

        #gzip  on;

        server {
            listen      80;
            listen [::]:80;
            server_name localhost;

            error_page   500 502 503 504  /50x.html;

            # Liveness and readiness for the Deployment. Keep this independent
            # of the SPA entry so a bad bundle cannot keep the pod "ready".
            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }

            # The console is served under /public/. Keep the bare root useful
            # instead of returning nginx's default 403.
            location = / {
                return 302 /public/;
            }

            # index.html is the release entry point. It must never be cached
            # long-term, otherwise a new deployment keeps loading the old
            # hashed assets.
            location = /public/index.html {
                root /usr/share/nginx/html;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
            }

            # Vite emits content-hashed files under /public/assets/. These are
            # safe to cache forever.
            location ^~ /public/assets/ {
                root /usr/share/nginx/html;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                access_log off;
            }

            location ^~ /public/ {
                root    /usr/share/nginx/html;
                expires 1h;
            }

            location ~* \.(gif|jpg|jpeg|png|css|js|ico|svg)$ {
                root /usr/share/nginx/html/public;
                expires 1h;
            }

            location ^~ /api/v1/label {
                resolver kube-dns.kube-system.svc.cluster.local;
                set $target http://kubecube-thanos-query.kubecube-monitoring.svc.cluster.local:9090;
                proxy_pass $target;
            }

            location ^~ /api/v1/series {
                resolver kube-dns.kube-system.svc.cluster.local;
                set $target http://kubecube-thanos-query.kubecube-monitoring.svc.cluster.local:9090;
                proxy_pass $target;
            }

            location ^~ /api/v1/query {
                resolver kube-dns.kube-system.svc.cluster.local;
                set $target http://kubecube-thanos-query.kubecube-monitoring.svc.cluster.local:9090;
                proxy_pass $target;
            }

            location ^~ /api/v1/query_range {
                resolver kube-dns.kube-system.svc.cluster.local;
                set $target http://kubecube-thanos-query.kubecube-monitoring.svc.cluster.local:9090;
                proxy_pass $target;
            }

            location ^~ /api/v1/logseer/ {
                resolver kube-dns.kube-system.svc.cluster.local;
                set $target http://logseer.logseer.svc.cluster.local;
                proxy_pass $target;
            }
    
            location ^~ /api/v2/logseer/ {
                resolver kube-dns.kube-system.svc.cluster.local;
                set $target http://logseer.logseer.svc.cluster.local;
                proxy_pass $target;
            }

            location ^~ /api/v1/cube/ {
                proxy_pass https://cube;
            }
            location ^~ /api/v1/audit {
                proxy_pass http://audit/api/v1/cube/audit;
            }

            location ^~ /api/v1/webconsole {
                proxy_pass http://webconsole/api/v1;
            }
            location ^~ /webconsole/api/sockjs {
                proxy_pass http://webconsole/api/sockjs;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
            }

            location / {
                root /usr/share/nginx/html/public;
                index index.html index.htm;
                try_files $uri $uri/ /index.html;
            }
        }
    }
---
#{{- end }}