{{/*
The locations the console servers share: the SPA files and every upstream
proxy. It is a named template because the TLS render has two servers - HTTP 80
for /healthz and the redirect, HTTPS 443 for everything else - and the proxy
list must not be maintained twice.
*/}}
{{- define "kubecube.frontend.locations" -}}
# The console is served under /public/. Keep the bare root useful instead of
# returning nginx's default 403.
location = / {
    return 302 /public/;
}

# index.html is the release entry point. It must never be cached long-term,
# otherwise a new deployment keeps loading the old hashed assets.
location = /public/index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
}

# Vite emits content-hashed files under /public/assets/. These are safe to
# cache forever.
location ^~ /public/assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location ^~ /public/ {
    root    /usr/share/nginx/html;
    expires 1h;
}

location ~* \.(gif|jpg|jpeg|png|css|js|ico|svg)$ {
    root /usr/share/nginx/html/public;
    expires 1h;
}

location ^~ /api/v1/label {
    resolver kube-dns.kube-system.svc.cluster.local;
    set $target http://kubecube-thanos-query.kubecube-monitoring.svc.cluster.local:9090;
    proxy_pass $target;
}

location ^~ /api/v1/series {
    resolver kube-dns.kube-system.svc.cluster.local;
    set $target http://kubecube-thanos-query.kubecube-monitoring.svc.cluster.local:9090;
    proxy_pass $target;
}

location ^~ /api/v1/query {
    resolver kube-dns.kube-system.svc.cluster.local;
    set $target http://kubecube-thanos-query.kubecube-monitoring.svc.cluster.local:9090;
    proxy_pass $target;
}

location ^~ /api/v1/query_range {
    resolver kube-dns.kube-system.svc.cluster.local;
    set $target http://kubecube-thanos-query.kubecube-monitoring.svc.cluster.local:9090;
    proxy_pass $target;
}

location ^~ /api/v1/logseer/ {
    resolver kube-dns.kube-system.svc.cluster.local;
    set $target http://logseer.logseer.svc.cluster.local;
    proxy_pass $target;
}

location ^~ /api/v2/logseer/ {
    resolver kube-dns.kube-system.svc.cluster.local;
    set $target http://logseer.logseer.svc.cluster.local;
    proxy_pass $target;
}

location ^~ /api/v1/cube/ {
    proxy_pass https://cube;
    {{- if .Values.frontend.tls.enabled }}
    # Cube's login and session renewal responses set the Authorization cookie
    # without the Secure attribute. Over HTTPS that cookie would be weaker than
    # the one netmgmt rebuilds, and the weaker one wins, so the console promotes
    # it on its own route too. HttpOnly and SameSite are left as cube sent them.
    proxy_cookie_flags Authorization secure;
    {{- end }}
}
location ^~ /api/v1/audit {
    proxy_pass http://audit/api/v1/cube/audit;
}

location ^~ /api/v1/webconsole {
    proxy_pass http://webconsole/api/v1;
}
location ^~ /webconsole/api/sockjs {
    proxy_pass http://webconsole/api/sockjs;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
}

# The optional network management component, including the versioned UI bundle
# under /api/v1/netmgmt/ui/. The upstream is a variable resolved per request
# through cluster DNS, so nginx starts and passes `nginx -t` while the Service
# does not exist; when the component is off this path simply fails at request
# time and every other route keeps working. The full Service name is required:
# the namespace search domain does not apply to a variable without a resolver.
location ^~ /api/v1/netmgmt/ {
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    set $netmgmt_upstream http://netmgmt.{{ template "kubecube.namespace" . }}.svc.cluster.local:8080;
    proxy_pass $netmgmt_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    {{- if .Values.frontend.tls.enabled }}
    # netmgmt already marks its rebuilt cookie Secure when it sees
    # X-Forwarded-Proto=https; promote the same cookie name anyway so no
    # earlier response can weaken it.
    proxy_cookie_flags Authorization secure;
    {{- end }}
}

location / {
    root /usr/share/nginx/html/public;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
}
{{- end }}
{{- if eq .Values.global.componentsEnable.frontend "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ template "kubecube.namespace" . }}
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /var/run/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        upstream cube {
            server kubecube:7443;
        }
        upstream audit {
            server audit:8888;
        }

        upstream webconsole {
            server webconsole:9081;
        }

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  65;

        #gzip  on;

        # Plain HTTP. /healthz stays here and is never redirected: the
        # Deployment's liveness and readiness probes speak HTTP on port 80.
        server {
            listen      80;
            listen [::]:80;
            server_name localhost;

            error_page   500 502 503 504  /50x.html;

            # Liveness and readiness for the Deployment. Keep this independent
            # of the SPA entry so a bad bundle cannot keep the pod "ready".
            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }
            {{- if .Values.frontend.tls.enabled }}

            # TLS terminates in this nginx; port 80 only points the browser at
            # the HTTPS NodePort. The certificate and key come from
            # frontend.tls.secretName and are mounted below /etc/nginx/tls.
            location / {
                return 301 https://$host:{{ .Values.frontend.tls.httpsNodePort }}$request_uri;
            }
            {{- else }}
            {{- include "kubecube.frontend.locations" . | nindent 12 }}
            {{- end }}
        }
        {{- if .Values.frontend.tls.enabled }}

        # Browser-facing TLS server. Both the cube and the netmgmt routes force
        # Secure on the Authorization cookie here, so alternating between the
        # console and the component can never downgrade the session cookie.
        server {
            listen              443 ssl;
            listen              [::]:443 ssl;
            server_name         localhost;

            ssl_certificate     /etc/nginx/tls/tls.crt;
            ssl_certificate_key /etc/nginx/tls/tls.key;
            ssl_protocols       TLSv1.2 TLSv1.3;
            ssl_session_cache   shared:SSL:10m;
            ssl_session_timeout 10m;

            error_page   500 502 503 504  /50x.html;

            {{- include "kubecube.frontend.locations" . | nindent 12 }}
        }
        {{- end }}
    }
---
{{- end }}
