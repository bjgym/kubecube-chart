{{- if eq .Values.global.componentsEnable.frontend "true" }}
{{- if and .Values.frontend.tls.enabled (eq (int .Values.frontend.tls.httpsNodePort) 30443) }}
{{- fail "frontend.tls.httpsNodePort must not be 30443: kubecube-nodeport already publishes its HTTPS port there" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  namespace: {{ template "kubecube.namespace" . }}
spec:
  type: NodePort
  selector:
    kubecube.io/app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
    {{- if .Values.frontend.tls.enabled }}
    - name: https
      port: 443
      targetPort: 443
      nodePort: {{ .Values.frontend.tls.httpsNodePort }}
    {{- end }}
---
{{- end }}
