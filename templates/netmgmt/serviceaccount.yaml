{{- if and (eq .Values.global.componentsEnable.netmgmt "true") (eq .Values.global.componentsEnable.kubecube "true") }}
# netmgmt has no Kubernetes API identity of its own: every resource operation is
# a request to cube carrying the calling user's credential. It therefore gets a
# ServiceAccount that cannot receive a token, and no Role, RoleBinding,
# ClusterRole, ClusterRoleBinding or Secret is created for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netmgmt
  namespace: {{ template "kubecube.namespace" . }}
  labels:
    kubecube.io/app: netmgmt
automountServiceAccountToken: false
---
{{- end }}
