{{- if eq .Values.global.certs.mode "custom" }}
apiVersion: v1
kind: Secret
metadata:
  name: cube-tls-secret
  namespace: {{ template "kubecube.namespace" . }}
type: kubernetes.io/tls
data:
  # The values are PEM text, which is how values.yaml documents them and what
  # the webhook's caBundle in _helpers.tpl encodes; a Secret's data is base64.
  # The pre-install job's "auto" path base64-encodes what cfssl produces into
  # these same four keys, so the two modes agree.
  #
  # required is not decoration: an unset custom value used to render an empty
  # secret, which fails later as a TLS error somewhere else entirely. Here it
  # fails at render time and names the value that is missing.
  tls.crt: {{ required "global.certs.custom.crt must be set when global.certs.mode is custom" .Values.global.certs.custom.crt | b64enc }}
  tls.key: {{ required "global.certs.custom.key must be set when global.certs.mode is custom" .Values.global.certs.custom.key | b64enc }}
  ca.crt: {{ required "global.certs.custom.caCrt must be set when global.certs.mode is custom" .Values.global.certs.custom.caCrt | b64enc }}
  ca.key: {{ required "global.certs.custom.caKey must be set when global.certs.mode is custom" .Values.global.certs.custom.caKey | b64enc }}
{{- end }}
